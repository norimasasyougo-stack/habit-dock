<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#eef6ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Habit Dock">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192-v3.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180-v3.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-v3.png">
  <title>Habit Dock</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #22252b;
      --muted: #666f7d;
      --quiet: #8a93a1;
      --line: #d6e0ec;
      --page: #eef6ff;
      --panel: #ffffff;
      --panel-soft: #f6faff;
      --mint: #1376e8;
      --mint-dark: #0b56b3;
      --mint-soft: #dcecff;
      --blue: #1167d8;
      --blue-soft: #e2f0ff;
      --rose: #b33b52;
      --rose-soft: #fae5ea;
      --gold: #8b5e00;
      --gold-soft: #fff0ca;
      --violet: #4f46e5;
      --violet-soft: #e9edff;
      --shadow: 0 18px 48px rgba(17, 103, 216, .14);
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html {
      min-height: 100%;
      background: var(--page);
      overflow-x: hidden;
      touch-action: pan-y;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 0%, rgba(19, 118, 232, .16), transparent 28rem),
        linear-gradient(180deg, #f8fbff 0%, var(--page) 42%, #e8f2ff 100%);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
      touch-action: pan-y;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      font-size: 16px;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--mint);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
      overflow-wrap: anywhere;
    }

    button:active { transform: translateY(2px) scale(.98); }
    button:hover { background: var(--mint-dark); }

    button.secondary {
      background: #e9edf1;
      color: var(--ink);
    }

    button.secondary:hover { background: #dfe5ea; }

    button.ghost {
      background: transparent;
      color: var(--blue);
      border: 1px solid #aec4dd;
    }

    button.danger {
      background: var(--rose);
    }

    button.icon {
      width: 44px;
      min-width: 44px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      font-size: 20px;
    }

    input,
    select,
    textarea {
      min-width: 0;
      width: 100%;
      min-height: 44px;
      border: 1px solid #c4cbd4;
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff;
      color: var(--ink);
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 4px solid rgba(37, 91, 156, .24);
      outline-offset: 2px;
    }

    .app {
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: env(safe-area-inset-top) 12px calc(86px + env(safe-area-inset-bottom));
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin: 0;
      padding: 14px max(12px, env(safe-area-inset-left)) 12px max(12px, env(safe-area-inset-left));
      background: rgba(238, 246, 255, .92);
      border-bottom: 1px solid rgba(217, 222, 229, .86);
      backdrop-filter: blur(16px);
    }

    h1,
    h2,
    h3,
    p { margin: 0; }

    h1 {
      font-size: 24px;
      line-height: 1.1;
    }

    h2 {
      font-size: 18px;
      line-height: 1.25;
    }

    h3 {
      font-size: 15px;
      line-height: 1.3;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .today-strip {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 18px 0 12px;
    }

    .score-ring {
      --value: 0deg;
      width: 86px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--mint) var(--value), #d7e4f2 0);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .04);
    }

    .score-ring span {
      width: 64px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff;
      color: var(--ink);
      font-size: 21px;
      font-weight: 900;
    }

    .hero-card {
      display: grid;
      gap: 12px;
      margin-bottom: 14px;
      padding: 14px;
      border: 1px solid #bed3ef;
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.96), rgba(220,236,255,.88)),
        radial-gradient(circle at 85% 10%, rgba(233, 237, 255, .96), transparent 18rem);
      box-shadow: var(--shadow);
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .hero-stat {
      min-height: 74px;
      display: grid;
      align-content: center;
      gap: 3px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(217, 222, 229, .9);
    }

    .hero-stat b {
      font-size: 22px;
      line-height: 1;
    }

    .hero-stat span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .level-bar {
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: #dce5e0;
      border: 1px solid #c9d4cf;
    }

    .level-bar span {
      display: block;
      width: var(--xp, 0%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--mint), var(--blue));
      transition: width .35s ease;
    }

    .praise {
      min-height: 42px;
      display: flex;
      gap: 9px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 8px;
      background: linear-gradient(135deg, #e2f0ff, #e9edff);
      color: #143f7b;
      font-weight: 850;
      border: 1px solid #b9d4f4;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    .panel,
    .habit,
    dialog {
      background: rgba(255, 255, 255, .94);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 14px;
    }

    .section-head,
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
    }

    .section-head {
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }

    .habit-list {
      display: grid;
      gap: 10px;
    }

    .habit-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .habit-summary .metric {
      min-height: 58px;
    }

    .transfer-card {
      margin-top: 12px;
      overflow: hidden;
      border: 1px solid #bed3ef;
      border-radius: 8px;
      background: rgba(255,255,255,.82);
      box-shadow: 0 10px 26px rgba(34, 37, 43, .06);
    }

    .transfer-card summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      min-height: 62px;
      padding: 12px;
      cursor: pointer;
      list-style: none;
    }

    .transfer-card summary::-webkit-details-marker {
      display: none;
    }

    .transfer-card summary::after {
      content: "⌄";
      display: grid;
      place-items: center;
      width: 34px;
      aspect-ratio: 1;
      border-radius: 8px;
      background: #eef3f8;
      color: var(--muted);
      font-weight: 950;
      transition: transform .18s ease;
    }

    .transfer-card[open] summary::after {
      transform: rotate(180deg);
    }

    .transfer-card summary span {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .transfer-card summary b {
      font-size: 15px;
      line-height: 1.25;
    }

    .transfer-card summary small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .transfer-body {
      display: grid;
      gap: 10px;
      padding: 0 12px 12px;
    }

    .transfer-steps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .transfer-steps div {
      min-height: 74px;
      display: grid;
      align-content: center;
      gap: 5px;
      padding: 9px;
      border: 1px solid #dce5ef;
      border-radius: 8px;
      background: var(--panel-soft);
    }

    .transfer-steps b {
      width: 24px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #52647a;
      color: #fff;
      font-size: 12px;
    }

    .transfer-steps span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
    }

    .habit {
      display: grid;
      gap: 12px;
      padding: 13px;
      box-shadow: 0 10px 26px rgba(34, 37, 43, .07);
    }

    .habit-top {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .check-button {
      width: 58px;
      min-width: 58px;
      aspect-ratio: 1;
      min-height: 58px;
      border-radius: 50%;
      border: 2px solid #b8c6c0;
      background: #fff;
      color: var(--quiet);
      font-size: 23px;
      line-height: 1;
      box-shadow: inset 0 0 0 5px #f0f6ff, 0 8px 18px rgba(17, 103, 216, .10);
    }

    .habit-status {
      display: inline-flex;
      width: fit-content;
      min-height: 30px;
      align-items: center;
      padding: 4px 9px;
      border-radius: 999px;
      background: #eef3f8;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .habit-status.done {
      background: var(--mint-soft);
      color: var(--mint-dark);
    }

    .habit-status.frozen {
      background: var(--blue-soft);
      color: #17477e;
    }

    .habit-progress {
      display: grid;
      gap: 7px;
    }

    .habit-progress-bar {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #dce7f3;
      border: 1px solid #c8d8ea;
    }

    .habit-progress-bar span {
      display: block;
      width: var(--progress, 0%);
      height: 100%;
      border-radius: inherit;
      background: var(--mint);
    }

    .graduated {
      border-color: #d5dde8;
      background: #f8fafc;
    }

    .check-button.done {
      border-color: var(--mint);
      background: var(--mint);
      color: #fff;
      box-shadow: inset 0 0 0 5px rgba(255, 255, 255, .18), 0 12px 24px rgba(19, 118, 232, .28);
    }

    .check-button.pop {
      animation: pop .34s ease;
    }

    @keyframes pop {
      0% { transform: scale(.86); }
      55% { transform: scale(1.14); }
      100% { transform: scale(1); }
    }

    .habit-title {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .habit-title strong {
      overflow-wrap: anywhere;
      font-size: 17px;
      line-height: 1.25;
    }

    .habit-title small,
    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .metric {
      min-height: 64px;
      padding: 8px;
      border-radius: 8px;
      background: var(--panel-soft);
      border: 1px solid #e4e8ed;
    }

    .metric b {
      display: block;
      font-size: 20px;
      line-height: 1.1;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .week {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .day-dot {
      min-height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      border: 1px solid #dde3e8;
      background: #f6f8f7;
      color: var(--quiet);
      font-size: 12px;
      font-weight: 850;
    }

    .day-dot.done {
      background: var(--mint-soft);
      border-color: #9fd2c5;
      color: #064c40;
    }

    .day-dot.frozen {
      background: var(--blue-soft);
      border-color: #a7c0df;
      color: #17477e;
    }

    .habit.is-done {
      border-color: #9fc5f3;
      background: linear-gradient(180deg, #fff, #f4f9ff);
    }

    .habit.is-frozen {
      border-color: #9eb9dc;
      background:
        linear-gradient(180deg, rgba(255,255,255,.97), rgba(226, 240, 255, .78));
    }

    .focus-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .primary-check {
      min-height: 62px;
      font-size: 18px;
      box-shadow: 0 12px 26px rgba(19, 118, 232, .22);
    }

    .primary-check.done {
      background: var(--mint-dark);
    }

    .freeze-button {
      min-height: 56px;
      background: #dbeafe;
      color: #17477e;
      border: 1px solid #a7c0df;
    }

    .freeze-button.active {
      background: #17477e;
      color: #fff;
    }

    .bonus-button {
      min-height: 56px;
      background: #143f7b;
    }

    .undo-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .xp-panel,
    .monster-panel {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid #bed3ef;
      border-radius: 8px;
      background: var(--panel-soft);
    }

    .xp-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .monster-panel {
      background: linear-gradient(135deg, #fff8e4, #f4f9ff);
      border-color: #ead28e;
    }

    .monster-teaser {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: center;
    }

    .mini-monster,
    .battle-monster {
      position: relative;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 18px 24px rgba(34, 37, 43, .2));
    }

    .mini-monster {
      width: 76px;
      aspect-ratio: 1;
    }

    .battle-monster {
      width: min(250px, 66vw);
      aspect-ratio: 1;
      margin: 8px auto 0;
      animation: monsterBreathe 1.8s ease-in-out infinite;
    }

    .boss-art-monster {
      position: relative;
      display: grid;
      place-items: center;
      isolation: isolate;
      filter: drop-shadow(0 24px 32px rgba(28, 12, 46, .34));
    }

    .boss-art-monster.mini-monster {
      width: 98px;
      overflow: hidden;
    }

    .boss-art-monster.battle-monster {
      width: min(312px, 82vw);
      aspect-ratio: 1;
      margin: 0 auto;
      animation: bossImageIdle 2.1s ease-in-out infinite;
    }

    .boss-art-monster.monster-mid {
      width: min(318px, 82vw);
    }

    .boss-art-monster.monster-boss {
      width: min(358px, 92vw);
      filter: drop-shadow(0 30px 42px rgba(8, 4, 17, .62));
      animation: finalBossFloat 1.7s ease-in-out infinite;
    }

    .boss-art-monster::before,
    .boss-art-monster::after {
      content: "";
      position: absolute;
      inset: 7%;
      z-index: -1;
      border-radius: 50%;
      pointer-events: none;
    }

    .boss-art-monster::before {
      background:
        radial-gradient(circle at 50% 48%, rgba(192, 132, 252, .38), transparent 52%),
        conic-gradient(from 120deg, transparent, rgba(126, 34, 206, .32), transparent 44%, rgba(217, 119, 6, .18), transparent 78%);
      animation: bossAuraSpin 3.8s linear infinite;
    }

    .boss-art-monster::after {
      inset: 18%;
      background: radial-gradient(circle, rgba(244, 114, 182, .28), transparent 64%);
      filter: blur(9px);
      animation: bossAuraPulse 1.25s ease-in-out infinite;
    }

    .boss-art-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-origin: 50% 58%;
      will-change: transform, filter;
    }

    .boss-art-monster.battle-monster .boss-art-image {
      width: 118%;
      height: 118%;
      animation: bossImageBreathe 1.45s ease-in-out infinite;
    }

    .boss-art-monster.monster-weak .boss-art-image {
      width: 102%;
      height: 102%;
    }

    .boss-art-monster.monster-mid .boss-art-image {
      width: 116%;
      height: 116%;
    }

    .boss-art-monster.monster-boss .boss-art-image {
      width: 136%;
      height: 136%;
      animation: finalBossPresence 1.8s ease-in-out infinite;
    }

    .boss-art-monster.is-hit .boss-art-image {
      animation: bossImageHit .28s ease, bossImageBreathe 1.45s ease-in-out infinite .28s;
      filter: brightness(1.38) saturate(1.22);
    }

    .boss-shockwave {
      position: absolute;
      inset: 28%;
      z-index: -1;
      border: 2px solid rgba(216, 180, 254, .68);
      border-radius: 50%;
      opacity: 0;
    }

    .boss-art-monster.battle-monster .boss-shockwave {
      animation: bossShockwave 1.6s ease-out infinite;
    }

    .boss-hit-flash {
      position: absolute;
      inset: 5%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.92), rgba(244,114,182,.22), transparent 62%);
      opacity: 0;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .boss-art-monster.is-hit .boss-hit-flash {
      animation: bossFlash .24s ease;
    }

    .monster-body {
      position: absolute;
      inset: 18%;
      border-radius: 42% 48% 46% 40%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,.52), transparent 22%),
        linear-gradient(145deg, #273159, #6246d9 58%, #17213f);
      border: 3px solid #15192e;
    }

    .monster-horn {
      position: absolute;
      top: 9%;
      width: 20%;
      height: 24%;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(135deg, #fff4c7, #c58b2d);
      border: 2px solid #4d3410;
      transform: rotate(-24deg);
    }

    .monster-horn.right {
      transform: rotate(114deg);
      right: 22%;
    }

    .monster-horn.left { left: 22%; }

    .monster-wing {
      position: absolute;
      top: 35%;
      width: 30%;
      height: 27%;
      border-radius: 70% 10% 70% 20%;
      background: linear-gradient(135deg, #2fd5ff, #285aa4);
      border: 3px solid #162442;
    }

    .monster-wing.left {
      left: 4%;
      transform: rotate(-22deg);
    }

    .monster-wing.right {
      right: 4%;
      transform: scaleX(-1) rotate(-22deg);
    }

    .monster-eye {
      position: absolute;
      top: 43%;
      width: 9%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #fff;
      box-shadow: inset 0 0 0 3px #1a1f33;
      z-index: 2;
    }

    .monster-eye::after {
      content: "";
      position: absolute;
      inset: 32%;
      border-radius: 50%;
      background: #f5365c;
    }

    .monster-eye.left { left: 41%; }
    .monster-eye.right { right: 34%; }

    .monster-mouth {
      position: absolute;
      top: 57%;
      left: 42%;
      width: 22%;
      height: 9%;
      border-radius: 0 0 999px 999px;
      background: #161a2d;
      z-index: 2;
    }

    .monster-mouth::before,
    .monster-mouth::after {
      content: "";
      position: absolute;
      top: 0;
      width: 18%;
      height: 95%;
      background: #fff;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .monster-mouth::before { left: 18%; }
    .monster-mouth::after { right: 18%; }

    .monster-mane,
    .monster-crown,
    .monster-tail,
    .monster-claw,
    .monster-ember {
      display: none;
    }

    .monster-weak {
      filter: drop-shadow(0 24px 30px rgba(62, 36, 107, .32));
    }

    .moment {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 24px;
      pointer-events: none;
      background: rgba(238, 246, 255, .18);
      opacity: 0;
      transform: scale(.98);
      transition: opacity .22s ease, transform .22s ease;
    }

    .moment.show {
      opacity: 1;
      transform: scale(1);
    }

    .moment-card {
      width: min(420px, calc(100vw - 36px));
      display: grid;
      gap: 10px;
      justify-items: center;
      padding: 22px;
      border-radius: 8px;
      background: rgba(255,255,255,.94);

      background: #17477e;
      box-shadow: 0 0 0 10px rgba(23, 71, 126, .13);
    }

    .moment-line {
      width: 72%;
      height: 2px;

      background: linear-gradient(90deg, transparent, var(--mint), transparent);
