      text-shadow: 0 0 16px rgba(216, 180, 254, .58), 0 2px 0 rgba(0, 0, 0, .32);
    }

    .battle-card.final-boss .battle-hp {
      background: #180c24;
      border-color: rgba(250, 204, 21, .42);
      box-shadow: 0 0 18px rgba(147, 51, 234, .38);
    }

    .battle-card.final-boss .battle-hp span {
      background: linear-gradient(90deg, #7f1d1d, #dc2626 38%, #f59e0b 72%, #fef3c7);
    }

    .battle-card.final-boss .attack-button {
      background: linear-gradient(135deg, #2e1065, #111827);
      box-shadow: 0 14px 34px rgba(88, 28, 135, .42);
    }

    .battle-title {
      display: grid;
      gap: 4px;
    }

    .battle-title h2 {
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
      font-size: clamp(20px, 5.4vw, 24px);
      line-height: 1.22;
    }

    .battle-hp {
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: #e8ecf2;
      border: 1px solid #ccd6e3;
    }

    .battle-hp span {
      display: block;
      width: var(--hp, 100%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #f43f5e, #f59e0b);
      transition: width .18s ease;
    }

    .battle-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .attack-button {
      min-height: 60px;
      background: #1f2a44;
      box-shadow: 0 12px 26px rgba(31, 42, 68, .24);
    }

    .slash {
      position: absolute;
      inset: 14%;
      opacity: 0;
      pointer-events: none;
    }

    .slash.hit {
      animation: slashHit .26s ease;
    }

    .slash::before {
      content: "";
      position: absolute;
      left: 18%;
      top: 44%;
      width: 68%;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #fff, #60a5fa, transparent);
      transform: rotate(-28deg);
      box-shadow: 0 0 18px rgba(96, 165, 250, .9);
    }

    @keyframes slashHit {
      0% { opacity: 0; transform: translate(-18px, 16px) scale(.8); }
      45% { opacity: 1; transform: translate(0, 0) scale(1.06); }
      100% { opacity: 0; transform: translate(18px, -16px) scale(1); }
    }

    .other-habits {
      display: grid;
      gap: 8px;
      padding-top: 2px;
    }

    .other-habit {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      min-height: 52px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      text-align: left;
    }

    .day-dot.missed {
      background: var(--rose-soft);
      border-color: #efbdc8;
      color: #813143;
    }

    .empty {
      display: grid;
      gap: 10px;
      min-height: 210px;
      place-items: center;
      text-align: center;
      padding: 24px;
      color: var(--muted);
      border: 1px dashed #c4cbd4;
      border-radius: 8px;
      background: rgba(255, 255, 255, .62);
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .quick {
      display: grid;
      gap: 4px;
      min-height: 74px;
      align-content: center;
      text-align: left;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .quick span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .calendar div {
      min-height: 38px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #f4f6f8;
      color: var(--quiet);
      font-size: 12px;
      font-weight: 800;
      border: 1px solid #e2e6eb;
    }

    .calendar .full {
      background: var(--mint);
      color: #fff;
      border-color: var(--mint);
    }

    .calendar .partial {
      background: var(--gold-soft);
      color: #5e4200;
      border-color: #e8c46c;
    }

    .calendar .frozen {
      background: var(--blue-soft);
      color: #17477e;
      border-color: #a7c0df;
    }

    .calendar .today {
      outline: 3px solid rgba(37, 91, 156, .25);
      outline-offset: 1px;
    }

    .form-grid {
      display: grid;
      gap: 11px;
    }

    label {
      display: grid;
      gap: 6px;
      color: #344052;
      font-weight: 800;
      font-size: 13px;
    }

    .inline-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .weekday-picker {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .weekday-picker label {
      display: block;
      position: relative;
      min-height: 40px;
      color: var(--ink);
      font-size: 13px;
    }

    .weekday-picker input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .weekday-picker span {
      display: grid;
      min-height: 40px;
      place-items: center;
      border-radius: 8px;
      border: 1px solid #cbd3dc;
      background: #fff;
      font-weight: 900;
    }

    .weekday-picker input:checked + span {
      color: #fff;
      background: var(--blue);
      border-color: var(--blue);
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      padding: 8px max(12px, env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-right));
      background: rgba(255, 255, 255, .94);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }

    .bottom-nav button {
      min-height: 52px;
      padding: 6px 8px;
      background: #eef2f4;
      color: var(--ink);
      display: grid;
      place-items: center;
      gap: 1px;
      font-size: 12px;
    }

    .bottom-nav button.active {
      background: var(--mint);
      color: #fff;
    }

    dialog {
      width: min(560px, calc(100vw - 24px));
      max-width: calc(100vw - 24px);
      max-height: min(780px, calc(100dvh - 24px));
      overflow: hidden;
      padding: 0;
    }

    dialog::backdrop {
      background: rgba(17, 24, 39, .32);
      backdrop-filter: blur(2px);
    }

    .dialog-inner {
      display: grid;
      gap: 12px;
      max-height: min(780px, calc(100dvh - 24px));
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 16px;
    }

    .dialog-actions {
      position: sticky;
      bottom: 0;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding-top: 10px;
      background: linear-gradient(180deg, rgba(255,255,255,.82), #fff 30%);
    }

    .dialog-actions .danger {
      grid-column: 1 / -1;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(82px + env(safe-area-inset-bottom));
      z-index: 20;
      max-width: min(460px, calc(100vw - 28px));
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      padding: 11px 14px;
      border-radius: 8px;
      background: #20252c;
      color: #fff;
      font-weight: 750;
      transition: .22s ease;
      box-shadow: var(--shadow);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 820px) {
      body { font-size: 15px; }

      input,
      select,
      textarea {
        font-size: 16px;
      }

      .app {
        padding-left: max(10px, env(safe-area-inset-left));
        padding-right: max(10px, env(safe-area-inset-right));
      }

      header {
        padding-right: max(10px, env(safe-area-inset-right));
      }

      h1 { font-size: 22px; }

      .today-strip {
        grid-template-columns: 1fr;
      }

      .hero-stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .score-ring {
        justify-self: start;
        width: 78px;
      }

      .score-ring span { width: 58px; }

      .layout {
        grid-template-columns: 1fr;
      }

      .metric-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .panel[data-view],
      .habit-panel[data-view] {
        display: none;
      }

      .panel[data-view].active,
      .habit-panel[data-view].active {
        display: block;
      }

      .bottom-nav {
        display: grid;
      }

      dialog {
        width: calc(100vw - 16px);
        max-width: calc(100vw - 16px);
        max-height: calc(100dvh - 16px);
        margin: auto;
      }

      .dialog-inner {
        max-height: calc(100dvh - 16px);
        padding: 12px;
        padding-bottom: max(12px, env(safe-area-inset-bottom));
      }

      .dialog-inner input,
      .dialog-inner select {
        min-height: 42px;
      }

      .dialog-inner textarea {
        min-height: 76px;
      }

      .dialog-inner .section-head {
        position: sticky;
        top: -12px;
        z-index: 3;
        margin: -12px -12px 0;
        padding: 12px;
        background: rgba(255, 255, 255, .96);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(14px);
      }
    }

    @media (max-width: 420px) {
      .app { padding-bottom: calc(92px + env(safe-area-inset-bottom)); }

      header {
        grid-template-columns: 1fr;
      }

      header .actions {
        display: grid;
        grid-template-columns: 1fr 44px;
      }

      .section-head {
        align-items: start;
      }

      .section-head h2 {
        overflow-wrap: anywhere;
      }

      .habit-top {
        grid-template-columns: auto 1fr;
      }

      .habit-top .actions {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .focus-actions,
      .xp-row,
      .undo-row,
      .battle-actions,
      .transfer-steps {
        grid-template-columns: 1fr;
      }

      .quick-grid,
      .inline-grid {
        grid-template-columns: 1fr;
      }

      .weekday-picker {
        gap: 5px;
      }

      .weekday-picker label,
      .weekday-picker span {
        min-height: 36px;
      }

      .dialog-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <p class="eyebrow" id="dateLabel">今日</p>
        <h1>Habit Dock</h1>
      </div>
      <div class="actions">
        <button type="button" id="addHabitBtn">習慣を追加</button>
        <button type="button" class="icon secondary" id="exportBtn" title="データを書き出し">⇧</button>
      </div>
    </header>

    <section class="today-strip">
      <div class="stack">
        <p class="eyebrow">今日の進捗</p>
        <h2 id="todayMessage">今日の連続記録を守りましょう</h2>
        <p class="muted" id="subMessage">習慣を登録すると、今日やることがここに並びます。</p>
      </div>
      <div class="score-ring" id="scoreRing" aria-label="今日の達成率">
        <span id="scoreText">0%</span>
      </div>
    </section>

    <main class="layout">
      <section class="habit-panel active" data-view="today">
        <div class="section-head">
          <div>
            <p class="eyebrow">チェックリスト</p>
            <h2>今日の習慣</h2>
          </div>
          <button type="button" class="secondary" id="resetTodayBtn">今日をリセット</button>
        </div>
        <div class="habit-summary">
          <div class="metric"><b id="doneCount">0</b><span>完了</span></div>
          <div class="metric"><b id="todoCount">0</b><span>未完了</span></div>
          <div class="metric"><b id="activeCount">0</b><span>今日の数</span></div>
        </div>
        <div class="habit-list" id="habitList"></div>
        <details class="transfer-card" id="transferCard">
          <summary>
            <span>
              <b>スマホ変更・データ引き継ぎ</b>
              <small>無料で新しい端末へ移せます</small>
            </span>
          </summary>
          <div class="transfer-body">
            <div class="transfer-steps">
              <div><b>1</b><span>今のスマホでコードを作る</span></div>
              <div><b>2</b><span>LINEやメモに保存する</span></div>
              <div><b>3</b><span>新しいスマホで貼り付けて復元</span></div>
            </div>
            <button type="button" id="copyTransferBtn">引き継ぎコードをコピー</button>
            <label>
              引き継ぎコード
              <textarea id="transferCode" placeholder="新しいスマホでは、ここに引き継ぎコードを貼り付けます"></textarea>
            </label>
            <button type="button" class="secondary" id="restoreTransferBtn">このコードから復元</button>
            <p class="muted" id="transferStatus">データはこの端末内に保存中。復元前には今のデータを自動で退避します。</p>
          </div>
        </details>
      </section>

      <aside class="stack">
        <section class="panel active" data-view="stats">
          <div class="section-head">
            <div>
              <p class="eyebrow">30日ログ</p>
              <h2>月間カレンダー</h2>
            </div>
          </div>
          <div class="calendar" id="calendarGrid"></div>
        </section>

        <section class="panel" data-view="library">
          <div class="section-head">
            <div>
              <p class="eyebrow">テンプレート</p>
              <h2>すぐ始める</h2>
            </div>
          </div>
          <div class="quick-grid" id="quickGrid"></div>
        </section>

        <section class="panel" data-view="library">
          <div class="section-head">
            <div>
              <p class="eyebrow">バックアップ</p>
              <h2>データ管理</h2>
            </div>
          </div>
          <div class="stack">
            <button type="button" class="ghost" id="copyBackupBtn">バックアップをコピー</button>
            <p class="muted" id="backupStatus">データはこの端末に保存され、自動バックアップも作られます。</p>
            <label>
              バックアップを復元
              <textarea id="restoreInput" placeholder="コピーしたバックアップ文字列を貼り付け"></textarea>
            </label>
            <button type="button" class="secondary" id="restoreBtn">復元する</button>
          </div>
        </section>
      </aside>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="表示切り替え">
    <button type="button" class="active" data-habit-tab="0">習慣1</button>
    <button type="button" data-habit-tab="1">習慣2</button>
    <button type="button" data-habit-tab="2">習慣3</button>
  </nav>

  <dialog id="habitDialog">
    <form method="dialog" class="dialog-inner" id="habitForm">
      <div class="section-head">
        <div>
          <p class="eyebrow" id="dialogMode">新しい習慣</p>
          <h2>習慣を編集</h2>
        </div>
        <button type="button" class="icon secondary" id="closeDialogBtn" title="閉じる">×</button>
      </div>

      <input type="hidden" id="habitId">
      <label>
        習慣名
        <input id="habitName" required maxlength="28" placeholder="例: 朝のストレッチ">
      </label>
      <div class="inline-grid">
        <label>
          カテゴリ
          <select id="habitCategory">
            <option>健康</option>
            <option>学習</option>
            <option>仕事</option>
            <option>暮らし</option>
            <option>心のケア</option>
          </select>
        </label>
        <label>
          時刻
          <input id="habitTime" type="time">
        </label>
      </div>
      <label>
        目標曜日
        <div class="weekday-picker" id="weekdayPicker"></div>
      </label>
      <label>
        メモ
        <textarea id="habitNote" maxlength="120" placeholder="続けるコツや、終わった後の気分など"></textarea>
      </label>
      <div class="actions dialog-actions">
        <button type="submit">保存</button>
        <button type="button" class="secondary" id="cancelDialogBtn">キャンセル</button>
        <button type="button" class="danger" id="deleteHabitBtn">削除</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="moment" id="moment" aria-live="polite"></div>
  <div class="battle-overlay" id="battleOverlay" role="dialog" aria-modal="true" aria-labelledby="battleTitle"></div>

  <script>
    const STORAGE_KEY = "habit-dock-v1";
    const STORAGE_BACKUP_KEY = "habit-dock-v1-auto-backup";
    const STORAGE_SNAPSHOTS_KEY = "habit-dock-v1-snapshots";
    const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
    const templates = [
      { name: "英語スピーキング", category: "学習", time: "20:00", note: "1レッスンだけ。日曜は休みでOK。", days: [1,2,3,4,5,6] },
      { name: "朝の水を飲む", category: "健康", time: "07:00", note: "起きたらコップ一杯。", days: [0,1,2,3,4,5,6] },
      { name: "10分だけ読書", category: "学習", time: "21:30", note: "ページ数より着席を勝ちにする。", days: [1,2,3,4,5] },
      { name: "部屋を5分リセット", category: "暮らし", time: "20:30", note: "床と机の上だけ見る。", days: [1,2,3,4,5] },
      { name: "今日のひとことメモ", category: "心のケア", time: "22:00", note: "よかったことを一行。", days: [0,1,2,3,4,5,6] }
    ];
    const monsters = [
      { id: "weak", name: "むくれ王 もちパンダ", threshold: 10, rank: "Rank 1", taps: 10 },
      { id: "mid", name: "冥淵の覇竜 ネルゲルド", threshold: 50, rank: "Rank 2", taps: 16 },
      { id: "boss", name: "終焉の覇王 ヴァルザーク", threshold: 100, rank: "Rank 3", taps: 24 }
    ];

    let state = loadState();
    let activeHabitId = null;
    let activeBattle = null;
    const seenMonsterPrompts = new Set();

    const els = {
      dateLabel: document.querySelector("#dateLabel"),
      todayMessage: document.querySelector("#todayMessage"),
      subMessage: document.querySelector("#subMessage"),
      scoreRing: document.querySelector("#scoreRing"),
      scoreText: document.querySelector("#scoreText"),
      habitList: document.querySelector("#habitList"),
      doneCount: document.querySelector("#doneCount"),
      todoCount: document.querySelector("#todoCount"),
      activeCount: document.querySelector("#activeCount"),
      calendarGrid: document.querySelector("#calendarGrid"),
      quickGrid: document.querySelector("#quickGrid"),
      toast: document.querySelector("#toast"),
      moment: document.querySelector("#moment"),
      battleOverlay: document.querySelector("#battleOverlay"),
      dialog: document.querySelector("#habitDialog"),
      form: document.querySelector("#habitForm"),
      habitId: document.querySelector("#habitId"),
      habitName: document.querySelector("#habitName"),
      habitCategory: document.querySelector("#habitCategory"),
      habitTime: document.querySelector("#habitTime"),
      habitNote: document.querySelector("#habitNote"),
      weekdayPicker: document.querySelector("#weekdayPicker"),
      deleteHabitBtn: document.querySelector("#deleteHabitBtn"),
      dialogMode: document.querySelector("#dialogMode"),
      restoreInput: document.querySelector("#restoreInput"),
      backupStatus: document.querySelector("#backupStatus"),
      transferCode: document.querySelector("#transferCode"),
      transferStatus: document.querySelector("#transferStatus")
    };

    function isoDate(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function fallbackState() {
      return {
        habits: [
          {
            id: crypto.randomUUID(),
            name: "朝のストレッチ",
            category: "健康",
            time: "07:30",
            note: "首、肩、背中をゆっくり伸ばす。",
            days: [0,1,2,3,4,5,6],
            createdAt: new Date().toISOString()
          },
          {
            id: crypto.randomUUID(),
            name: "英語を5分",
            category: "学習",
            time: "20:00",
            note: "短くてもアプリを開いたら勝ち。",
            days: [1,2,3,4,5],
            createdAt: new Date().toISOString()
          }
        ],
        completions: {},
        freezes: {},
        efforts: {},
        monsters: {}
      };
    }

    function normalizeState(value) {
      if (!value || !Array.isArray(value.habits) || !value.completions || typeof value.completions !== "object") {
        return null;
      }
      return {
        habits: value.habits,
        completions: value.completions || {},
        freezes: value.freezes || {},
        efforts: value.efforts || {},
        monsters: value.monsters || {}
      };
    }

    function parseStoredState(key) {
      try {
        return normalizeState(JSON.parse(localStorage.getItem(key)));
      } catch (error) {
        console.warn(`Could not read ${key}`, error);
        return null;
      }
    }

    function writeStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch (error) {
        console.warn(`Could not write ${key}`, error);
        return false;
      }
    }

    function rememberSnapshot(value) {
      try {
        const snapshots = JSON.parse(localStorage.getItem(STORAGE_SNAPSHOTS_KEY) || "[]");
        snapshots.unshift({ savedAt: new Date().toISOString(), data: value });
        localStorage.setItem(STORAGE_SNAPSHOTS_KEY, JSON.stringify(snapshots.slice(0, 5)));
      } catch (error) {
        console.warn("Could not write snapshots", error);
      }
    }

    function loadState() {
      const saved = parseStoredState(STORAGE_KEY);
      if (saved) {
        writeStorage(STORAGE_BACKUP_KEY, saved);
        return saved;
      }

      const backup = parseStoredState(STORAGE_BACKUP_KEY);
      if (backup) {
        writeStorage(STORAGE_KEY, backup);
        setTimeout(() => showToast("自動バックアップから復旧しました"), 300);
        return backup;
      }

      try {
        const snapshots = JSON.parse(localStorage.getItem(STORAGE_SNAPSHOTS_KEY) || "[]");
        const snapshot = snapshots.map((item) => normalizeState(item.data)).find(Boolean);
        if (snapshot) {
          writeStorage(STORAGE_KEY, snapshot);
          writeStorage(STORAGE_BACKUP_KEY, snapshot);
          setTimeout(() => showToast("保存履歴から復旧しました"), 300);
          return snapshot;
        }
      } catch (error) {
        console.warn(error);
      }

      return fallbackState();
    }

    function saveState() {
      const normalized = normalizeState(state);
      if (!normalized) return;
      const previous = parseStoredState(STORAGE_KEY);
      if (previous) writeStorage(STORAGE_BACKUP_KEY, previous);
      writeStorage(STORAGE_KEY, normalized);
      writeStorage(STORAGE_BACKUP_KEY, normalized);
      rememberSnapshot(normalized);
    }

    function habitsFor(date) {
      return state.habits.filter((habit) => habit.days.includes(date.getDay()));
    }

    function doneSet(dateKey = isoDate()) {
      return new Set(state.completions[dateKey] || []);
    }

    function freezeSet(dateKey = isoDate()) {
      return new Set(state.freezes?.[dateKey] || []);
    }

    function isDone(habitId, dateKey = isoDate()) {
      return doneSet(dateKey).has(habitId);
    }

    function isFrozen(habitId, dateKey = isoDate()) {
      return freezeSet(dateKey).has(habitId);
    }

    function effortCount(habitId, dateKey = isoDate()) {
      return Number(state.efforts?.[dateKey]?.[habitId] || 0);
    }

    function dayXp(count) {
      return (count * (count + 1)) / 2;
    }

    function setEffort(habitId, count, dateKey = isoDate()) {
      if (!state.efforts) state.efforts = {};
      if (!state.efforts[dateKey]) state.efforts[dateKey] = {};
      if (count <= 0) delete state.efforts[dateKey][habitId];
      else state.efforts[dateKey][habitId] = count;
      if (!Object.keys(state.efforts[dateKey]).length) delete state.efforts[dateKey];
    }

    function addEffort(habitId) {
      const key = isoDate();
      const nextCount = effortCount(habitId, key) + 1;
      const set = doneSet(key);
      const frozen = freezeSet(key);
      set.add(habitId);
      frozen.delete(habitId);
      state.completions[key] = [...set];
      state.freezes[key] = [...frozen];
      setEffort(habitId, nextCount, key);
      reconcileMonsterUnlocks([habitId]);
      saveState();
      render();
      celebrate(habitId, nextCount);
    }

    function undoEffort(habitId) {
      const key = isoDate();
      const current = effortCount(habitId, key);
      if (current <= 0 && !isDone(habitId, key)) {
        showToast("今日の記録はまだありません");
        return;
      }

      const set = doneSet(key);
      if (current > 1) {
        setEffort(habitId, current - 1, key);
        state.completions[key] = [...set];
        reconcileMonsterUnlocks([habitId]);
        saveState();
        render();
        showToast(`今日の回数を${current - 1}回に戻しました`);
        return;
      }

      set.delete(habitId);
      state.completions[key] = [...set];
      setEffort(habitId, 0, key);
      reconcileMonsterUnlocks([habitId]);
      saveState();
      render();
      showToast("今日の完了を取り消しました");
    }

    function toggleHabit(habitId) {
      const key = isoDate();
      const set = doneSet(key);
      const frozen = freezeSet(key);
      if (set.has(habitId)) {
        set.delete(habitId);
        setEffort(habitId, 0, key);
      } else {
        set.add(habitId);
        frozen.delete(habitId);
        setEffort(habitId, Math.max(1, effortCount(habitId, key)), key);
      }
      state.completions[key] = [...set];
      state.freezes[key] = [...frozen];
      reconcileMonsterUnlocks([habitId]);
      saveState();
      render();
      if (set.has(habitId)) celebrate(habitId, effortCount(habitId, key));
    }

    function toggleFreeze(habitId) {
      const key = isoDate();
      if (isDone(habitId, key)) {
        showToast("完了済みなのでフリーズは不要です");
        return;
      }
      const available = freezeAllowance(habitId);
      const frozen = freezeSet(key);
      if (!frozen.has(habitId) && available <= 0) {
        showToast("フリーズは2日まで。3日目は再開の日です");
        return;
      }
      if (frozen.has(habitId)) frozen.delete(habitId);
      else frozen.add(habitId);
      state.freezes[key] = [...frozen];
      saveState();
      render();
      if (frozen.has(habitId)) {
        const left = freezeAllowance(habitId);
        showMoment("freeze", "フリーズしました", `継続は維持されています。残り${left}回`);
        showToast("フリーズしました。継続は維持されています");
      } else {
        showToast("フリーズを戻しました");
      }
    }

    function completionFor(date) {
      const scheduled = habitsFor(date);
      if (!scheduled.length) return { total: 0, done: 0, frozen: 0, protected: 0, ratio: 0 };
      const set = doneSet(isoDate(date));
      const frozen = freezeSet(isoDate(date));
      const done = scheduled.filter((habit) => set.has(habit.id)).length;
      const frozenCount = scheduled.filter((habit) => frozen.has(habit.id)).length;
      const protectedCount = done + frozenCount;
      return { total: scheduled.length, done, frozen: frozenCount, protected: protectedCount, ratio: protectedCount / scheduled.length };
    }

    function streakForHabit(habit) {
      let streak = 0;
      let freezesUsed = 0;
      const date = new Date();
      for (let i = 0; i < 365; i += 1) {
        const key = isoDate(date);
        const scheduled = habit.days.includes(date.getDay());
        if (scheduled && isDone(habit.id, key)) streak += 1;
        else if (scheduled && isFrozen(habit.id, key) && freezesUsed < 2) {
          streak += 1;
          freezesUsed += 1;
        } else if (scheduled) break;
        date.setDate(date.getDate() - 1);
      }
      return streak;
    }

    function freezeAllowance(habitId) {
      const habit = state.habits.find((item) => item.id === habitId);
      if (!habit) return 0;
      let used = 0;
      const date = new Date();
      for (let i = 0; i < 30; i += 1) {
        const key = isoDate(date);
        const scheduled = habit.days.includes(date.getDay());
        if (scheduled && isFrozen(habit.id, key)) used += 1;
        else if (scheduled && !isDone(habit.id, key)) break;
        date.setDate(date.getDate() - 1);
      }
      return Math.max(0, 2 - used);
    }

    function applyAutoFreezes() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const startLimit = new Date(today);
      startLimit.setDate(today.getDate() - 90);
      let applied = 0;

      state.habits.forEach((habit) => {
        const created = new Date(habit.createdAt || today);
        created.setHours(0, 0, 0, 0);
        const cursor = new Date(Math.max(created.getTime(), startLimit.getTime()));
        let freezeChain = 0;

        while (cursor < today) {
          if (habit.days.includes(cursor.getDay())) {
            const key = isoDate(cursor);
            const done = isDone(habit.id, key);
            const frozen = isFrozen(habit.id, key);

            if (done) {
              freezeChain = 0;
            } else if (frozen) {
              freezeChain += 1;
            } else if (freezeChain < 2) {
              const frozenSet = freezeSet(key);
              frozenSet.add(habit.id);
              state.freezes[key] = [...frozenSet];
              freezeChain += 1;
              applied += 1;
            } else {
              freezeChain = 3;
            }
          }
          cursor.setDate(cursor.getDate() + 1);
        }
      });

      return applied;
    }

    function totalProtectedStreak() {
      let streak = 0;
      const date = new Date();
      for (let i = 0; i < 365; i += 1) {
        const info = completionFor(date);
        if (!info.total) {
          date.setDate(date.getDate() - 1);
          continue;
        }
        if (info.protected === info.total) streak += 1;
        else break;
        date.setDate(date.getDate() - 1);
      }
      return streak;
    }

    function daysSince(dateString) {
      const start = new Date(dateString || new Date().toISOString());
      const today = new Date();
      start.setHours(0, 0, 0, 0);
      today.setHours(0, 0, 0, 0);
      return Math.max(0, Math.floor((today - start) / 86400000) + 1);
    }

    function isGraduated(habit) {
      return daysSince(habit.createdAt) > 30;
    }

    function habitSort(a, b) {
      const graduationDiff = Number(isGraduated(a)) - Number(isGraduated(b));
      if (graduationDiff) return graduationDiff;
      return new Date(a.createdAt || 0) - new Date(b.createdAt || 0);
    }

    function priorityHabits() {
      return [...state.habits].sort(habitSort);
    }

    function activeHabit() {
      const sorted = priorityHabits();
      if (!sorted.length) return null;
      const current = sorted.find((habit) => habit.id === activeHabitId) || sorted[0];
      activeHabitId = current.id;
      return current;
    }

    function missedScheduledDays(habit) {
      const created = new Date(habit.createdAt || new Date());
      created.setHours(0, 0, 0, 0);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      let missed = 0;
      for (let i = 0; i < 30; i += 1) {
        const date = new Date(today);
        date.setDate(today.getDate() - i - 1);
        if (date < created) break;
        if (!habit.days.includes(date.getDay())) continue;
        const key = isoDate(date);
        if (!isDone(habit.id, key) && !isFrozen(habit.id, key)) missed += 1;
      }
      return missed;
    }

    function rawHabitXp(habit) {
      return Object.entries(state.efforts || {}).reduce((sum, [dateKey, efforts]) => {
        if (!efforts?.[habit.id]) return sum;
        return sum + dayXp(Number(efforts[habit.id] || 0));
      }, 0);
    }

    function habitXp(habit) {
      const raw = rawHabitXp(habit);
      const missed = missedScheduledDays(habit);
      const penalty = missed * 10;
      return { raw, missed, penalty, total: Math.max(0, raw - penalty) };
    }

    function defeatedMonsters(habitId) {
      return state.monsters?.[habitId] || {};
    }

    function currentMonster(habit, xp) {
      const defeated = defeatedMonsters(habit.id);
      return monsters.find((monster) => xp >= monster.threshold && !defeated[monster.id]);
    }

    function rankForHabit(habit) {
      const defeatedCount = Object.values(defeatedMonsters(habit.id)).filter(Boolean).length;
      return defeatedCount ? monsters[Math.min(defeatedCount - 1, monsters.length - 1)].rank : "Start";
    }

    function reconcileMonsterUnlocks(habitIds = state.habits.map((habit) => habit.id)) {
      if (!state.monsters) return;
      habitIds.forEach((habitId) => {
        const habit = state.habits.find((item) => item.id === habitId);
        const defeated = state.monsters?.[habitId];
        if (!habit || !defeated) return;

        const xp = habitXp(habit).total;
        monsters.forEach((monster) => {
          if (defeated[monster.id] && xp < monster.threshold) {
            delete defeated[monster.id];
            seenMonsterPrompts.delete(`${habitId}:${monster.id}`);
          }
        });

        if (!Object.keys(defeated).length) delete state.monsters[habitId];
      });
    }

    function defeatMonster(habitId, monsterId) {
      if (!state.monsters) state.monsters = {};
      if (!state.monsters[habitId]) state.monsters[habitId] = {};
      state.monsters[habitId][monsterId] = true;
      activeBattle = null;
      els.battleOverlay.className = "battle-overlay";
      els.battleOverlay.innerHTML = "";
      saveState();
      render();
      showMoment("done", "討伐完了", "ランクアップしました");
      showToast("倒しました。ランクアップです");
    }

    function monsterMarkup(size = "mini", monsterId = "weak", hit = false) {
      const bossAssets = {
        weak: "assets/panda-king-boss.png",
        mid: "assets/abyss-dragon-boss.png",
        boss: "assets/final-overlord-boss.png"
      };
      if (bossAssets[monsterId]) {
        const typeClass = monsterId === "mid" ? "monster-mid" : "monster-weak";
        return `
          <div class="${size === "battle" ? "battle-monster" : "mini-monster"} boss-art-monster ${typeClass} ${hit ? "is-hit" : ""}" aria-hidden="true">
            <div class="boss-shockwave"></div>
            <img class="boss-art-image" src="${bossAssets[monsterId]}" alt="">
            <div class="boss-hit-flash"></div>
            ${size === "battle" ? `<div class="slash" id="slashEffect"></div>` : ""}
          </div>
        `;
      }

      const typeClass = monsterId === "mid" ? "monster-mid" : monsterId === "boss" ? "monster-boss" : "monster-weak";
      return `
        <div class="${size === "battle" ? "battle-monster" : "mini-monster"} ${typeClass}" aria-hidden="true">
          <div class="monster-afterimage"></div>
          <div class="monster-ember"></div>
          <div class="monster-wing left"></div>
          <div class="monster-wing right"></div>
          <div class="monster-tail"></div>
          <div class="monster-mane"></div>
          <div class="monster-horn left"></div>
          <div class="monster-horn right"></div>
          <div class="monster-crown"></div>
          <div class="monster-body"></div>
          <div class="monster-eye left"></div>
          <div class="monster-eye right"></div>
          <div class="monster-mouth"></div>
          <div class="monster-claw left"></div>
          <div class="monster-claw right"></div>
          <div class="monster-blade"></div>
          ${size === "battle" ? `<div class="slash" id="slashEffect"></div>` : ""}
        </div>
      `;
    }

    function showMoment(type, title, message) {
      els.moment.className = `moment ${type}`;
      els.moment.innerHTML = `
        <div class="moment-card">
          <div class="moment-mark">${type === "freeze" ? "氷" : "✓"}</div>
          ${type === "done" ? streakDotsMarkup(showMoment.streak || 1) : ""}
          <div class="moment-line"></div>
          <h2>${escapeHtml(title)}</h2>
          <p class="muted">${escapeHtml(message)}</p>
        </div>
      `;
      requestAnimationFrame(() => els.moment.classList.add("show"));
      clearTimeout(showMoment.timer);
      showMoment.timer = setTimeout(() => {
        els.moment.classList.remove("show");
      }, 1850);
    }

    function streakDotsMarkup(streak) {
      const count = Math.max(1, Math.min(14, Number(streak) || 1));
      return `
        <div class="streak-dots" aria-label="${count}日継続">
          ${Array.from({ length: count }, (_, index) => `
            <span class="streak-dot checked" style="--delay: ${index * 92}ms">✓</span>
          `).join("")}
        </div>
      `;
    }

    function openMonsterBattle(habitId, monsterId) {
      const habit = state.habits.find((item) => item.id === habitId);
      const monster = monsters.find((item) => item.id === monsterId);
      if (!habit || !monster) return;
      activeBattle = { habitId, monsterId, hits: 0 };
      renderBattle();
    }

    function closeMonsterBattle() {
      activeBattle = null;
      els.battleOverlay.className = "battle-overlay";
      els.battleOverlay.innerHTML = "";
    }

    function attackMonster() {
      if (!activeBattle) return;
      const monster = monsters.find((item) => item.id === activeBattle.monsterId);
      if (!monster) return;
      activeBattle.hits += 1;
      renderBattle(true);
      if (activeBattle.hits >= monster.taps) {
        setTimeout(() => defeatMonster(activeBattle.habitId, activeBattle.monsterId), 220);
      }
    }

    function renderBattle(hit = false) {
      if (!activeBattle) return;
      const habit = state.habits.find((item) => item.id === activeBattle.habitId);
      const monster = monsters.find((item) => item.id === activeBattle.monsterId);
      if (!habit || !monster) return;
      const remaining = Math.max(0, monster.taps - activeBattle.hits);
      const hp = Math.max(0, Math.round((remaining / monster.taps) * 100));
      els.battleOverlay.className = `battle-overlay show ${monster.id === "boss" ? "final-boss" : ""}`;
      els.battleOverlay.innerHTML = `
        <div class="battle-card ${monster.id === "boss" ? "final-boss" : ""}">
          <div class="battle-title">
            <p class="eyebrow">${monster.threshold}XP 到達</p>
            <h2 id="battleTitle">${monster.name}が現れた</h2>
            <p class="muted">${escapeHtml(habit.name)}の力で討伐しましょう。${monster.taps}回タップ！</p>
          </div>
          ${monsterMarkup("battle", monster.id, hit)}
          <div class="battle-hp" aria-label="モンスターの残り体力"><span style="--hp: ${hp}%"></span></div>
          <p class="muted">あと${remaining}回タップで討伐</p>
          <div class="battle-actions">
            <button type="button" class="attack-button" id="attackMonsterBtn">タップしろ！！</button>
            <button type="button" class="secondary" id="closeBattleBtn">あとで</button>
          </div>
        </div>
      `;
      document.querySelector("#attackMonsterBtn").addEventListener("click", attackMonster);
      document.querySelector("#closeBattleBtn").addEventListener("click", closeMonsterBattle);
      document.querySelector(".battle-monster").addEventListener("click", attackMonster);
      if (hit) {
        const slash = document.querySelector("#slashEffect");
        slash?.classList.add("hit");
      }
    }

    function offerMonsterBattle(habit, monster) {
      if (!habit || !monster || activeBattle) return;
      const key = `${habit.id}:${monster.id}`;
      if (seenMonsterPrompts.has(key)) return;
      seenMonsterPrompts.add(key);
      setTimeout(() => openMonsterBattle(habit.id, monster.id), 380);
    }

    function habitMonthStats(habit) {
      const created = new Date(habit.createdAt || new Date());
      created.setHours(0, 0, 0, 0);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      let scheduled = 0;
      let protectedDays = 0;
      for (let i = 0; i < 30; i += 1) {
        const date = new Date(created);
        date.setDate(created.getDate() + i);
        if (date > today) break;
        if (!habit.days.includes(date.getDay())) continue;
        scheduled += 1;
        const key = isoDate(date);
        if (isDone(habit.id, key) || isFrozen(habit.id, key)) protectedDays += 1;
      }
      const age = Math.min(30, daysSince(habit.createdAt));
      return {
        age,
        remaining: Math.max(0, 30 - age),
        scheduled,
        protectedDays,
        progress: Math.min(100, Math.round((age / 30) * 100)),
        graduated: isGraduated(habit)
      };
    }

    function renderWeek(habit) {
      const today = new Date();
      const start = new Date(today);
      start.setDate(today.getDate() - 6);
      return Array.from({ length: 7 }, (_, index) => {
        const date = new Date(start);
        date.setDate(start.getDate() + index);
        const scheduled = habit.days.includes(date.getDay());
        const key = isoDate(date);
        const done = isDone(habit.id, key);
        const frozen = isFrozen(habit.id, key);
        const cls = done ? "done" : frozen ? "frozen" : scheduled && date < new Date(isoDate()) ? "missed" : "";
        const mark = done ? "✓" : frozen ? "氷" : weekdays[date.getDay()];
        return `<div class="day-dot ${cls}" title="${key}">${mark}</div>`;
      }).join("");
    }

    function renderHabits() {
      const habit = activeHabit();
      const todayHabits = habitsFor(new Date()).sort((a, b) => habitSort(a, b) || (a.time || "99:99").localeCompare(b.time || "99:99"));
      if (!habit) {
        els.habitList.innerHTML = `
          <div class="empty">
            <h2>習慣はまだありません</h2>
            <p>右上の「習慣を追加」から、まずは1つだけ置いてみましょう。</p>
            <button type="button" onclick="openHabitDialog()">習慣を追加</button>
          </div>
        `;
        return;
      }

      const done = isDone(habit.id);
      const frozen = isFrozen(habit.id);
      const streak = streakForHabit(habit);
      const freezeLeft = freezeAllowance(habit.id);
      const month = habitMonthStats(habit);
      const attempts = effortCount(habit.id);
      const xp = habitXp(habit);
      const monster = currentMonster(habit, xp.total);
      const statusText = done ? "今日完了" : frozen ? "今日は休みで保護" : "今日まだ";
      const graduationText = month.graduated ? "30日卒業済み。優先度は下がりますが記録は続きます。" : `習慣化まであと${month.remaining}日`;
      const otherToday = todayHabits.filter((item) => item.id !== habit.id);

      els.habitList.innerHTML = `
        <article class="habit ${done ? "is-done" : ""} ${frozen ? "is-frozen" : ""} ${month.graduated ? "graduated" : ""}" id="habit-${habit.id}">
          <div class="habit-top">
            <button type="button" class="check-button ${done ? "done pop" : ""}" aria-label="${habit.name}を${done ? "未完了" : "完了"}にする" data-toggle="${habit.id}">${done ? "✓" : ""}</button>
            <div class="habit-title">
              <strong>${escapeHtml(habit.name)}</strong>
              <small>${escapeHtml(habit.category)}${habit.time ? ` ・ ${habit.time}` : ""}</small>
              <span class="habit-status ${done ? "done" : frozen ? "frozen" : ""}">${statusText}</span>
            </div>
            <div class="actions">
              <button type="button" class="secondary" data-edit="${habit.id}">編集</button>
              <button type="button" class="danger" data-delete="${habit.id}">削除</button>
            </div>
          </div>

          <button type="button" class="primary-check ${done ? "done" : ""}" data-toggle="${habit.id}">
            ${done ? "完了済み。取り消す" : "今日やった"}
          </button>

          ${done ? `
            <button type="button" class="bonus-button" data-effort="${habit.id}">
              もう1回やってみる？ 次は${attempts + 1}XP
            </button>
            <div class="undo-row">
              <button type="button" class="secondary" data-undo-effort="${habit.id}">1回分戻す</button>
              <button type="button" class="ghost" data-toggle="${habit.id}">今日の完了を取り消す</button>
            </div>
          ` : `
            <button type="button" class="freeze-button ${frozen ? "active" : ""}" data-freeze="${habit.id}">
              ${frozen ? "フリーズを戻す" : `今日は休む（残り${freezeLeft}）`}
            </button>
          `}

          <div class="xp-panel">
            <div class="xp-row">
              <div class="metric"><b>${attempts}</b><span>今日の回数</span></div>
              <div class="metric"><b>${xp.total}</b><span>有効XP</span></div>
              <div class="metric"><b>${rankForHabit(habit)}</b><span>ランク</span></div>
            </div>
            <div class="habit-progress">
              <div class="row">
                <span class="muted">${graduationText}</span>
                <span class="muted">${month.protectedDays}/${month.scheduled || 0}日記録</span>
              </div>
              <div class="habit-progress-bar" aria-label="30日習慣化の進捗"><span style="--progress: ${month.progress}%"></span></div>
            </div>
            <p class="muted">素のXP ${xp.raw} ・ 未継続ペナルティ -${xp.penalty}XP（${xp.missed}日）</p>
          </div>

          ${monster ? `
            <div class="monster-panel">
              <div class="monster-teaser">
                ${monsterMarkup("mini", monster.id)}
                <div>
                  <p class="eyebrow">${monster.threshold}XP 到達</p>
                  <h3>${monster.name}が現れた</h3>
                  <p class="muted">${monster.taps}回タップで討伐できます。</p>
                </div>
              </div>
              <button type="button" data-battle="${habit.id}:${monster.id}">討伐に向かう</button>
            </div>
          ` : ""}

          <div class="week">${renderWeek(habit)}</div>
          <p class="muted">${streak}日継続 ・ ${habit.days.map((day) => weekdays[day]).join("")}${habit.note ? ` ・ ${escapeHtml(habit.note)}` : ""}</p>
        </article>

        ${otherToday.length ? `
          <div class="other-habits">
            <p class="eyebrow">ほかの今日の習慣</p>
            ${otherToday.map((item) => `
              <button type="button" class="other-habit" data-select-habit="${item.id}">
                <span>${escapeHtml(item.name)}</span>
                <span class="habit-status ${isDone(item.id) ? "done" : isFrozen(item.id) ? "frozen" : ""}">${isDone(item.id) ? "完了" : isFrozen(item.id) ? "休み" : "まだ"}</span>
              </button>
            `).join("")}
          </div>
        ` : ""}
      `;

      document.querySelectorAll("[data-toggle]").forEach((button) => {
        button.addEventListener("click", () => toggleHabit(button.dataset.toggle));
      });
      document.querySelectorAll("[data-effort]").forEach((button) => {
        button.addEventListener("click", () => addEffort(button.dataset.effort));
      });
      document.querySelectorAll("[data-undo-effort]").forEach((button) => {
        button.addEventListener("click", () => undoEffort(button.dataset.undoEffort));
      });
      document.querySelectorAll("[data-edit]").forEach((button) => {
        button.addEventListener("click", () => openHabitDialog(button.dataset.edit));
      });
      document.querySelectorAll("[data-freeze]").forEach((button) => {
        button.addEventListener("click", () => toggleFreeze(button.dataset.freeze));
      });
      document.querySelectorAll("[data-delete]").forEach((button) => {
        button.addEventListener("click", () => deleteHabitById(button.dataset.delete));
      });
      document.querySelectorAll("[data-select-habit]").forEach((button) => {
        button.addEventListener("click", () => {
          activeHabitId = button.dataset.selectHabit;
          render();
        });
      });
      document.querySelectorAll("[data-battle]").forEach((button) => {
        button.addEventListener("click", () => {
          const [habitId, monsterId] = button.dataset.battle.split(":");
          openMonsterBattle(habitId, monsterId);
        });
      });
      offerMonsterBattle(habit, monster);
    }

    function renderSummary() {
      const today = completionFor(new Date());
      const percent = today.total ? Math.round(today.ratio * 100) : 0;
      els.scoreRing.style.setProperty("--value", `${percent * 3.6}deg`);
      els.scoreText.textContent = `${percent}%`;
      els.doneCount.textContent = today.done;
      els.todoCount.textContent = Math.max(0, today.total - today.protected);
      els.activeCount.textContent = today.total;
      els.dateLabel.textContent = new Intl.DateTimeFormat("ja-JP", { dateStyle: "full" }).format(new Date());

      if (!today.total) {
        els.todayMessage.textContent = "今日は自由日です";
        els.subMessage.textContent = "今日の対象習慣はありません。必要なら習慣を追加できます。";
      } else if (today.done === today.total) {
        els.todayMessage.textContent = `${today.done}/${today.total} 完了`;
        els.subMessage.textContent = "今日の習慣は全部チェック済みです。";
      } else {
        const protectedLeft = today.total - today.protected;
        els.todayMessage.textContent = `${today.protected}/${today.total} チェック済み`;
        els.subMessage.textContent = `未完了は${protectedLeft}個です。上のカードを押せばすぐ記録できます。`;
      }
    }

    function weekStart(date = new Date()) {
      const start = new Date(date);
      start.setDate(date.getDate() - date.getDay());
      start.setHours(0, 0, 0, 0);
      return start;
    }

    function weeklyXp() {
      const start = weekStart();
      let xp = 0;
      for (let i = 0; i < 7; i += 1) {
        const date = new Date(start);
        date.setDate(start.getDate() + i);
        const key = isoDate(date);
        xp += (state.completions[key] || []).length * 10;
        xp += (state.freezes[key] || []).length * 3;
      }
      return xp;
    }

    function habitWeeklyScore(habit) {
      const start = weekStart();
      let score = 0;
      for (let i = 0; i < 7; i += 1) {
        const date = new Date(start);
        date.setDate(start.getDate() + i);
        const key = isoDate(date);
        if (isDone(habit.id, key)) score += 10;
        else if (isFrozen(habit.id, key)) score += 3;
      }
      return score;
    }

    function rankForXp(xp) {
      const ranks = [
        { name: "Blue", min: 0, next: 50 },
        { name: "Sky", min: 50, next: 110 },
        { name: "Royal", min: 110, next: 190 },
        { name: "Diamond", min: 190, next: 300 }
      ];
      let current = ranks[0];
      ranks.forEach((rank) => {
        if (xp >= rank.min) current = rank;
      });
      const range = current.next - current.min;
      return { ...current, progress: Math.min(100, Math.round(((xp - current.min) / range) * 100)) };
    }

    function praiseFor(done, streak, xp) {
      if (streak >= 30) return "30日ラインを越えています。これはもう気分ではなく、あなたの仕組みです。";
      if (streak >= 7) return "1週間以上つながっています。続いている自分をちゃんと見てあげましょう。";
      if (xp >= 50) return "今週の積み上げが見えています。リーグを上げる楽しさが出てきました。";
      if (done >= 2) return "今日の自分に、ちゃんと約束を返せています。いい流れです。";
      return "小さくても完了。続く人は、この小ささを大事にします。";
    }

    function celebrate(habitId, attempt = 1) {
      const habit = state.habits.find((item) => item.id === habitId);
      if (!habit) return;
      const streak = streakForHabit(habit);
      if (attempt === 1) {
        showMoment.streak = streak;
        showMoment("done", `${streak}日継続中`, "今日も流れを守りました");
      }
      const lines = [
        `${habit.name}、完了。今日の一票が入りました。`,
        `${attempt}回目。+${attempt}XPです。積み上がっています。`,
        `${streak}日ラインです。静かに強いです。`,
        "押せました。今のタップは未来の自分に効きます。"
      ];
      showToast(attempt > 1 ? lines[1] : lines[Math.min(lines.length - 1, streak % lines.length)]);
    }

    function renderCalendar() {
      const today = new Date();
      const start = new Date(today);
      start.setDate(today.getDate() - 29);
      els.calendarGrid.innerHTML = Array.from({ length: 30 }, (_, index) => {
        const date = new Date(start);
        date.setDate(start.getDate() + index);
        const info = completionFor(date);
        const cls = info.total && info.protected === info.total ? "full" : info.frozen ? "frozen" : info.done ? "partial" : "";
        const todayCls = isoDate(date) === isoDate() ? "today" : "";
        return `<div class="${cls} ${todayCls}" title="${isoDate(date)}">${date.getDate()}</div>`;
      }).join("");
    }

    function renderTemplates() {
      els.quickGrid.innerHTML = templates.map((template, index) => `
        <button type="button" class="quick" data-template="${index}">
          ${escapeHtml(template.name)}
          <span>${escapeHtml(template.category)} ・ ${template.time}</span>
        </button>
      `).join("");
      document.querySelectorAll("[data-template]").forEach((button) => {
        button.addEventListener("click", () => {
          const item = templates[Number(button.dataset.template)];
          const habit = { ...item, id: crypto.randomUUID(), createdAt: new Date().toISOString() };
          state.habits.push(habit);
          activeHabitId = habit.id;
          saveState();
          render();
          showToast("テンプレートを追加しました");
        });
      });
    }

    function renderBackupStatus() {
      if (!els.backupStatus) return;
      const backup = parseStoredState(STORAGE_BACKUP_KEY);
      const habitCount = state.habits.length;
      const recordCount = Object.keys(state.completions || {}).length + Object.keys(state.freezes || {}).length;
      els.backupStatus.textContent = backup
        ? `自動バックアップ済み。習慣${habitCount}件、記録${recordCount}日分をこの端末に保護しています。`
        : `習慣${habitCount}件をこの端末に保存中。次の操作で自動バックアップも作られます。`;
      if (els.transferStatus && !els.transferStatus.dataset.locked) {
        els.transferStatus.textContent = `この端末に習慣${habitCount}件、記録${recordCount}日分を保存中。コードを作れば新しいスマホへ移せます。`;
      }
    }

    function renderWeekdayPicker(selected = [0,1,2,3,4,5,6]) {
      els.weekdayPicker.innerHTML = weekdays.map((day, index) => `
        <label>
          <input type="checkbox" value="${index}" ${selected.includes(index) ? "checked" : ""}>
          <span>${day}</span>
        </label>
      `).join("");
    }

    function openHabitDialog(id = "") {
      const habit = state.habits.find((item) => item.id === id);
      els.dialogMode.textContent = habit ? "習慣を編集" : "新しい習慣";
      els.habitId.value = habit?.id || "";
      els.habitName.value = habit?.name || "";
      els.habitCategory.value = habit?.category || "健康";
      els.habitTime.value = habit?.time || "";
      els.habitNote.value = habit?.note || "";
      els.deleteHabitBtn.hidden = !habit;
      renderWeekdayPicker(habit?.days || [0,1,2,3,4,5,6]);
      els.dialog.showModal();
      els.habitName.focus();
    }

    function closeHabitDialog() {
      els.dialog.close();
      els.form.reset();
    }

    function saveHabit(event) {
      event.preventDefault();
      const days = [...els.weekdayPicker.querySelectorAll("input:checked")].map((input) => Number(input.value));
      if (!days.length) {
        showToast("目標曜日を1つ以上選んでください");
        return;
      }
      const existing = state.habits.find((habit) => habit.id === els.habitId.value);

      const payload = {
        id: els.habitId.value || crypto.randomUUID(),
        name: els.habitName.value.trim(),
        category: els.habitCategory.value,
        time: els.habitTime.value,
        note: els.habitNote.value.trim(),
        days,
        createdAt: existing?.createdAt || new Date().toISOString()
      };

      const index = state.habits.findIndex((habit) => habit.id === payload.id);
      if (index >= 0) state.habits[index] = { ...state.habits[index], ...payload };
      else state.habits.push(payload);
      activeHabitId = payload.id;

      saveState();
      closeHabitDialog();
      render();
      showToast("保存しました");
    }

    function deleteHabit() {
      deleteHabitById(els.habitId.value);
      closeHabitDialog();
    }

    function deleteHabitById(id) {
      const habit = state.habits.find((item) => item.id === id);
      if (!habit) return;
      if (!confirm(`「${habit.name}」を削除しますか？記録も削除されます。`)) return;
      state.habits = state.habits.filter((habit) => habit.id !== id);
      Object.keys(state.completions).forEach((key) => {
        state.completions[key] = state.completions[key].filter((habitId) => habitId !== id);
      });
      Object.keys(state.freezes).forEach((key) => {
        state.freezes[key] = state.freezes[key].filter((habitId) => habitId !== id);
      });
      Object.keys(state.efforts || {}).forEach((key) => {
        delete state.efforts[key][id];
        if (!Object.keys(state.efforts[key]).length) delete state.efforts[key];
      });
      delete state.monsters?.[id];
      if (activeHabitId === id) activeHabitId = null;
      saveState();
      render();
      showToast("削除しました");
    }

    function encodeTransferData(value) {
      const payload = {
        app: "habit-dock",
        version: 1,
        exportedAt: new Date().toISOString(),
        state: normalizeState(value)
      };
      const bytes = new TextEncoder().encode(JSON.stringify(payload));
      let binary = "";
      for (let i = 0; i < bytes.length; i += 0x8000) {
        binary += String.fromCharCode(...bytes.slice(i, i + 0x8000));
      }
      return `HD1.${btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "")}`;
    }

    function decodeTransferData(input) {
      const code = String(input || "").trim().replace(/\s+/g, "");
      if (!code) return null;
      try {
        if (code.startsWith("HD1.")) {
          const base64 = code.slice(4).replace(/-/g, "+").replace(/_/g, "/");
          const padded = base64.padEnd(Math.ceil(base64.length / 4) * 4, "=");
          const binary = atob(padded);
          const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
          const payload = JSON.parse(new TextDecoder().decode(bytes));
          return normalizeState(payload.state || payload.data || payload);
        }

        const legacyText = decodeURIComponent(escape(atob(code)));
        return normalizeState(JSON.parse(legacyText));
      } catch (error) {
        console.warn("Could not decode transfer data", error);
        return null;
      }
    }

    function syncTransferFields(code = "") {
      if (els.transferCode) els.transferCode.value = code;
      if (els.restoreInput) els.restoreInput.value = code;
    }

    function setTransferStatus(message) {
      if (els.transferStatus) els.transferStatus.textContent = message;
    }

    function exportData() {
      const backup = encodeTransferData(state);
      syncTransferFields(backup);
      setTransferStatus("引き継ぎコードを作りました。LINE、メモ、自分宛メールなどに保存してください。");

      if (!navigator.clipboard?.writeText) {
        showToast("コードを表示しました。長押しでコピーできます");
        return;
      }

      navigator.clipboard.writeText(backup).then(
        () => showToast("引き継ぎコードをコピーしました"),
        () => showToast("コードを表示しました。長押しでコピーできます")
      );
    }

    function restoreData(source = els.restoreInput) {
      const sourceValue = typeof source === "string" ? source : source?.value;
      const normalized = decodeTransferData(sourceValue || els.transferCode?.value || "");
      if (!normalized) {
        setTransferStatus("コードを読み取れませんでした。コピー漏れがないか確認してください。");
        showToast("復元できませんでした");
        return;
      }

      const habitCount = normalized.habits.length;
      const recordCount = Object.keys(normalized.completions || {}).length + Object.keys(normalized.freezes || {}).length;
      if (!confirm(`この端末のデータを退避してから、習慣${habitCount}件・記録${recordCount}日分を復元します。よろしいですか？`)) return;

      const current = normalizeState(state);
      if (current) {
        writeStorage(STORAGE_BACKUP_KEY, current);
        rememberSnapshot(current);
      }

      state = normalized;
      activeHabitId = null;
      reconcileMonsterUnlocks();
      saveState();
      render();
      setTransferStatus(`復元できました。習慣${habitCount}件、記録${recordCount}日分をこの端末に保存しました。`);
      showMoment("restore", "復元できました", "新しいスマホでも同じ状態で使えます");
      showToast("復元しました");
    }

    function resetToday() {
      const affectedHabitIds = habitsFor(new Date()).map((habit) => habit.id);
      state.completions[isoDate()] = [];
      state.freezes[isoDate()] = [];
      delete state.efforts?.[isoDate()];
      activeBattle = null;
      els.battleOverlay.className = "battle-overlay";
      els.battleOverlay.innerHTML = "";
      reconcileMonsterUnlocks(affectedHabitIds);
      saveState();
      render();
      showToast("今日のチェックをリセットしました");
    }

    function renderHabitTabs() {
      const sorted = priorityHabits();
      const priority = sorted.slice(0, 3);
      if (activeHabitId && !state.habits.some((habit) => habit.id === activeHabitId)) activeHabitId = null;
      if (!activeHabitId && sorted.length) activeHabitId = sorted[0].id;
      document.querySelectorAll("[data-habit-tab]").forEach((button, index) => {
        const habit = priority[index];
        button.hidden = false;
        if (!habit) {
          button.textContent = `${index + 1}. 追加`;
          button.classList.remove("active");
          button.onclick = () => openHabitDialog();
          return;
        }
        button.textContent = `${index + 1}. ${habit.name.slice(0, 5)}`;
        button.classList.toggle("active", habit.id === activeHabitId);
        button.onclick = () => {
          activeHabitId = habit.id;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => els.toast.classList.remove("show"), 2200);
    }

    function render() {
      renderSummary();
      renderHabits();
      renderCalendar();
      renderTemplates();
      renderBackupStatus();
      renderHabitTabs();
    }

    document.querySelector("#addHabitBtn").addEventListener("click", () => openHabitDialog());
    document.querySelector("#closeDialogBtn").addEventListener("click", closeHabitDialog);
    document.querySelector("#cancelDialogBtn").addEventListener("click", closeHabitDialog);
    document.querySelector("#resetTodayBtn").addEventListener("click", resetToday);
    document.querySelector("#exportBtn").addEventListener("click", exportData);
    document.querySelector("#copyBackupBtn").addEventListener("click", exportData);
    document.querySelector("#copyTransferBtn").addEventListener("click", exportData);
    document.querySelector("#restoreBtn").addEventListener("click", () => restoreData(els.restoreInput));
    document.querySelector("#restoreTransferBtn").addEventListener("click", () => restoreData(els.transferCode));
    els.form.addEventListener("submit", saveHabit);
    els.deleteHabitBtn.addEventListener("click", deleteHabit);
    ["gesturestart", "gesturechange", "gestureend"].forEach((eventName) => {
      document.addEventListener(eventName, (event) => event.preventDefault(), { passive: false });
    });

    document.addEventListener("touchmove", (event) => {
      if (event.scale && event.scale !== 1) event.preventDefault();
    }, { passive: false });

    const autoFreezeCount = applyAutoFreezes();
    if (autoFreezeCount) saveState();
    render();
    if (autoFreezeCount) {
      showToast(`${autoFreezeCount}件を自動フリーズしました。継続は守られています`);
    }
  </script>
</body>
</html>
